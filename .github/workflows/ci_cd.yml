
name: Churn_Prediction project CI/CD

on:
  push:
    branches:
      - Main
  workflow_dispatch: 
  
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: run tests
        run: pytest -v 

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      
      - name: AWS Configure
        uses:  aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: ${{secrets.AWS_REGION}}
      
      - name: Login To Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and Push Image to ECR
        env:
          ECR_REPOSITORY: ${{secrets.ECR_REPOSITORY}}
          ECR_REGISTRY: ${{secrets.ECR_REGISTRY}}
          IMAGE_TAG: ${{github.sha}}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker $ECR_REGISTRY/$ECR_REPOSITORY:latest 

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_URI: ${{secrets.ECR_REGISTRY}}/${{secrets.ECR_REPOSITORY}}/:${{github.sha}}
          ECR_REGISTRY: ${{secrets.ECR_REGISTRY}}
          AWS_REGION: ${{secrets.AWS_REGION}}
        with:
          host: ${{secrets.EC2_HOST}}
          username: ${{secrets.EC2_USERNAME}}
          key: ${{secrets.EC2_SSH_KEY}}
        
          envs: IMAGE_URI,ECR_REGISTRY,AWS_REGION
          script: |
            set -e 

            set -a 
            source /home/ec2-user/.env
            set +a

            aws ecr get-login-password --region "$AWS_REGION" | sudo docker login --username AWS --password-stdin "$ECR_REGISTRY"

            sudo docker pull "$IMAGE_URI"

            sudo docker stop churn-container || true
            sudo docker rm churn-container || true

            sudo docker run -d --name churn-container --restart unless-stopped --env-file /home/ec2-user/.env -p 8501:8501 "$IMAGE_URI"

      
        



  